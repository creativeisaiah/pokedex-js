<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokemon Codex</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/header.css" />
    <link rel="stylesheet" href="./css/pokemonInfo.css" />
  </head>
  <body>
    <!-- Header -->
    <div class="header">
      <div class="headerTitle">
        <i class="bi bi-chat-square-text"></i>
        <h1>ALL POKÉMON</h1>
      </div>

      <div class="headerId">
        <img id="pokeball" src="./media/pokeball.svg" alt="Pokeball" />
        <p>Number Registered:</p>
        <p id="pokemonId">0</p>
      </div>

      <div class="headerUser">
        <p id="currentTime"></p>
        <img id="userImage" src="/media/user.png" alt="User Image" />
      </div>
    </div>

    <!-- Main Section  -->
    <div class="main">
      <div class="pokemonInfo">
        <!-- Pokemon Heading -->
        <div class="pokemonHeading">
          <p class="pokemonNum" id="pokemonNum"></p>
          <p class="pokemonName" id="pokemonName"></p>
          <p class="pokemonType" id="pokemonSpecies"></p>

          <div class="pokemonGender" id="pokemonGender">
            <!-- optional: JS can fill later -->
          </div>
        </div>

        <!-- Pokemon Visuals -->
        <div class="pokemonVisuals">
          <div class="pokemonStats">
            <div class="statCard">
              <p class="statHeading">Height</p>
              <p class="stat" id="height"></p>
            </div>
            <div class="statCard">
              <p class="statHeading">Weight</p>
              <p class="stat" id="weight"></p>
            </div>
          </div>

          <div class="pokemonView">
            <button class="btnIcon" id="prevBtn" aria-label="Previous Pokémon">
              <i class="bi bi-chevron-left"></i>
              <div class="arrowKeyBox-left">L</div>
            </button>

            <img src="" alt="Pokemon sprite" id="pokemonSprite" />

            <button class="btnIcon" id="nextBtn" aria-label="Next Pokémon">
              <div class="arrowKeyBox-right">R</div>
              <i class="bi bi-chevron-right"></i>
            </button>
          </div>

          <div class="pokemonTypes">
            <div id="typesWrap">
              <!-- JS will add type chips here -->
            </div>

            <div class="forms">
              <p id="formsText"></p>
            </div>
          </div>
        </div>

        <!-- Pokemon Ability Menu -->
        <div class="abilityDefinitions">
          <div class="abilityMenu">
            <button class="btnIcon" id="abilityPrev" aria-label="Previous ability">
              <i class="bi bi-chevron-left"></i>
              <div class="arrowKeyBox-left">A</div>
            </button>

            <div class="abilities" id="abilitiesWrap">
              <!-- JS will add ability icons here -->
            </div>

            <button class="btnIcon" id="abilityNext" aria-label="Next ability">
              <div class="arrowKeyBox-right">D</div>
              <i class="bi bi-chevron-right"></i>
            </button>
          </div>

          <div class="abilityText" id="abilityText"></div>
        </div>
      </div>

      <!-- Pokemon List Side Menu -->
      <div class="pokedex">
        <div class="sideMenuHeader">
          <p>Pokedex Number</p>
        </div>

        <div class="pokemonList" id="pokemonList">
          <!-- JS will generate the list items -->
        </div>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
</html>
